# esto es obligatorio ya que es donde defines que es lo que va a pasar en el compose
services: 
  #esto ees simplemente el nombre que le vamos a poner al servicio 
  mongodb:
    #esto es la version de la imagen que tiene que descargar de docker hub
    # despues de los ":" va la version, de normal se deberia usar la latest o la ultima estable
    image: mongo:latest
    # esto es el nombre que tendra el contenedor, es decir, como vamos a llamarlo al momento de usar comandos y todo 
    container_name: mongodb_test
    environment:
      # aqui declaramos las variables de entorno que va a usar, en este caso declaramos el 
      #usuario de la db la password de la db y el nombre de la db. Poner admin y 1234 
      # obviamente noe s una buena idea pero es un test controlado, asi que... ;)
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
      MONGO_INITDB_DATABASE: mongodb_docker_test
    # aqui declaramos los puertos que va a usar el contenedor, a la izquerda elegimos cual usar 
    # en localhost , a la derecha el que mongo tiene como predeterminado. 
    # Lo dice en la documentacion. 
    ports:
      - "27000:27017"
    # esto es para persistencia de datos, vamos a declarar un volumen donde se va a guardar
    #  la informacion del contenedor para que asi no se reinicie cada vez que lo levantamos
    volumes:
      # va a pillar la info que hay dentro de la carpeta /data/db del contenedor y la va a 
      # guardar en la carpeta mongo_data de nuestra máquina. Hay otra forma de declararlo
      # pero declarandolo asi el volemn se crea en /var/lib/docker/volumes/<proyecto>_mongo_data/
      - mongo_data:/data/db
volumes:
  mongo_data: