services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_test
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
      MONGO_INITDB_DATABASE: mongodb_docker_test
    ports:
      - "27000:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: pokemerch_backend
    environment:
      PORT: 3000
      MONGO_URI: mongodb://admin:1234@mongodb:27017/?authSource=admin
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-secret-change-me}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      UPLOADS_DIR: /app/media
    ports:
      - "3000:3000"
    volumes:
      - ../api/media:/app/media
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

