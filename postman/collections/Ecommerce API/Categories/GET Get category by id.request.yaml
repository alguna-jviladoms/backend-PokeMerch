$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 5000
