$kind: http-request
url: "{{baseUrl}}/api/categories?active=true&sort=name&page=1&limit=10"
method: GET
queryParams:
  active: "true"
  sort: name
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON', () => pm.response.to.be.json);
      pm.test('Has pagination metadata', () => pm.expect(pm.response.json().pagination).to.have.property('totalPages'));
    language: text/javascript
order: 4000
