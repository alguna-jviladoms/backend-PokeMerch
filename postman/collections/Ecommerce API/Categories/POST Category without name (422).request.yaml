$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "slug": "{{missingNameSlug}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('missingNameSlug', `no-name-${Date.now()}`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 422', () => pm.response.to.have.status(422));
      pm.test('Response is JSON', () => pm.response.to.be.json);
      pm.test('Validation error code', () => pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR'));
    language: text/javascript
order: 2000
