$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "precio": 31.99
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 4000
