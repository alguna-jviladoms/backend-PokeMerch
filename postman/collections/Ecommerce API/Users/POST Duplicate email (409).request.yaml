$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Usuario duplicado",
      "email": "{{testEmail}}",
      "password": "ClaveLocalPostman2026!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 409', () => pm.response.to.have.status(409));
      pm.test('Response is JSON', () => pm.response.to.be.json);
      pm.test('Duplicate email code', () => pm.expect(pm.response.json().error.code).to.eql('DUPLICATE_EMAIL'));
    language: text/javascript
order: 2000
