$kind: http-request
url: "{{baseUrl}}/api/categories?page=1&limit=1"
method: GET
queryParams:
  page: "1"
  limit: "1"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve el listado paginado", () => {
        const body = pm.response.json();
        pm.expect(body.success).to.equal(true);
        pm.expect(body.data).to.be.an("array");
        pm.expect(body.pagination.limit).to.equal(1);
      });
    language: text/javascript
order: 3000
