$kind: http-request
url: "{{baseUrl}}/api/categories?page=1&limit=1"
method: GET
queryParams:
  page: "1"
  limit: "1"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
