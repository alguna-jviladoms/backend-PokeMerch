$kind: http-request
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{previousRefreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401", () => pm.response.to.have.status(401));
      pm.test("REFRESH_TOKEN_REUSED", () => {
        const body = pm.response.json();
        pm.expect(body.success).to.equal(false);
        pm.expect(body.error.code).to.equal("REFRESH_TOKEN_REUSED");
      });
    language: text/javascript
order: 7000
