$kind: http-request
url: "{{baseUrl}}/api/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Confirma el cierre de sesión", () => {
        pm.expect(pm.response.json().data.message).to.equal("Sesión cerrada");
      });
    language: text/javascript
order: 11000
